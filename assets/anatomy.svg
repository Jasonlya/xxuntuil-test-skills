<svg xmlns="http://www.w3.org/2000/svg" width="880" height="528" viewBox="0 0 880 528" role="img" aria-label="每个 skill 的结构：元数据常驻上下文，SKILL.md 正文触发后加载，references / assets / scripts 按需加载">
  <rect x="0.5" y="0.5" width="879" height="527" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
    <text x="36" y="50" font-size="22" font-weight="700" fill="#0f172a">一个 skill 长什么样</text>
    <text x="36" y="76" font-size="13" fill="#64748b">三层加载：越靠上层越占上下文，所以正文只留骨架，细则一律外链</text>
  </g>

  <line x1="56" y1="124" x2="56" y2="364" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="32" y="96" width="438" height="104" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <circle cx="56" cy="120" r="13" fill="#4f46e5"/>
  <text x="56" y="125" text-anchor="middle" font-family="'PingFang SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
    <text x="84" y="126" font-size="15.5" font-weight="700" fill="#1e1b4b">元数据</text>
    <text x="84" y="150" font-size="12.5" fill="#475569">name + description，常驻上下文</text>
    <text x="84" y="172" font-size="12.5" fill="#475569">Agent 靠它决定要不要用你 —— 写虚了就不再触发</text>
    <text x="452" y="126" text-anchor="end" font-size="11" fill="#4338ca">最贵</text>
  </g>

  <rect x="32" y="216" width="438" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="56" cy="240" r="13" fill="#94a3b8"/>
  <text x="56" y="245" text-anchor="middle" font-family="'PingFang SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
    <text x="84" y="246" font-size="15.5" font-weight="700" fill="#0f172a">正文 SKILL.md</text>
    <text x="84" y="270" font-size="12.5" fill="#475569">触发后才加载：铁律 · 工作流 · 边界 · 常见错误</text>
    <text x="84" y="292" font-size="12.5" fill="#475569">只留骨架，控制在 500 行内</text>
    <text x="452" y="246" text-anchor="end" font-size="11" fill="#64748b">次之</text>
  </g>

  <rect x="32" y="336" width="438" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="56" cy="360" r="13" fill="#cbd5e1"/>
  <text x="56" y="365" text-anchor="middle" font-family="'PingFang SC',system-ui,sans-serif" font-size="13" font-weight="700" fill="#334155">3</text>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
    <text x="84" y="366" font-size="15.5" font-weight="700" fill="#0f172a">资源</text>
    <text x="84" y="390" font-size="12.5" fill="#475569">references 规范 / 矩阵 · assets 模板</text>
    <text x="84" y="412" font-size="12.5" fill="#475569">scripts 闸门 —— 用到才读</text>
    <text x="452" y="366" text-anchor="end" font-size="11" fill="#64748b">最省</text>
  </g>

  <rect x="496" y="96" width="352" height="344" rx="12" fill="#0d1117"/>
  <g font-family="'SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12.5" xml:space="preserve">
    <text x="516" y="128" fill="#c9d1d9">skills/</text>
    <text x="534" y="156" fill="#7ee787">c2d-case-writing/</text>
    <text x="812" y="156" text-anchor="end" fill="#6b7f96">目录名=name</text>
    <text x="552" y="184" fill="#c9d1d9">SKILL.md</text>
    <text x="812" y="184" text-anchor="end" fill="#6b7f96">唯一入口</text>
    <text x="552" y="212" fill="#c9d1d9">references/</text>
    <text x="812" y="212" text-anchor="end" fill="#6b7f96">按需</text>
    <text x="552" y="240" fill="#c9d1d9">assets/</text>
    <text x="812" y="240" text-anchor="end" fill="#6b7f96">模板</text>
    <text x="552" y="268" fill="#c9d1d9">scripts/</text>
    <text x="812" y="268" text-anchor="end" fill="#6b7f96">闸门</text>
    <text x="552" y="296" fill="#c9d1d9">README.md</text>
    <text x="812" y="296" text-anchor="end" fill="#6b7f96">详情页</text>
    <text x="534" y="324" fill="#8b949e">下一个 skill/</text>
    <text x="812" y="324" text-anchor="end" fill="#6b7f96">加同级目录</text>
  </g>
  <line x1="516" y1="344" x2="828" y2="344" stroke="#21262d"/>
  <text x="516" y="372" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#d29922"># 目录名 ≠ name 会静默不加载</text>
  <text x="516" y="398" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#6b7f96">仓库级闸门会拦，但装到宿主后才发现就晚了</text>

  <rect x="32" y="464" width="816" height="40" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="52" y="489" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#475569">仓库级闸门</text>
  <text x="124" y="489" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#0f172a">check_repo.py</text>
  <text x="234" y="489" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#475569">：命名 · 元数据 · 断链 · 脚本语法，提交前拦掉「装不上」</text>
</svg>
