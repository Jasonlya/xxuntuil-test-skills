<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="C2D Case Writing —— 为设计稿转代码编写图片校验用例的测试 Skill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.5" stop-color="#0e1526"/>
      <stop offset="1" stop-color="#171233"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#60a5fa" opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="270" cy="110" rx="280" ry="180" fill="#1e3a8a" opacity="0.45" filter="url(#soft)"/>
  <ellipse cx="1370" cy="560" rx="320" ry="210" fill="#4c1d95" opacity="0.45" filter="url(#soft)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <text x="800" y="196" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="27" font-weight="600" fill="#93c5fd">面向 AI Agent 的测试 Skill 合集</text>

  <text x="800" y="330" text-anchor="middle" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="94" font-weight="700" fill="url(#title)" letter-spacing="-1">C2D Case Writing</text>

  <text x="800" y="400" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="36" font-weight="500" fill="#e2e8f0">每条图片用例都挂真实直链</text>

  <text x="800" y="446" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="23" fill="#94a3b8">且这张图真的能触发它 —— 图不对，用例等于没写</text>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="23" font-weight="500" fill="#cbd5e1">
    <rect x="551" y="495" width="172" height="58" rx="29" fill="#ffffff" opacity="0.07" stroke="#3f4a63" stroke-width="1.5"/>
    <text x="637" y="531" text-anchor="middle">真实图片直链</text>
    <rect x="747" y="495" width="128" height="58" rx="29" fill="#ffffff" opacity="0.07" stroke="#3f4a63" stroke-width="1.5"/>
    <text x="811" y="531" text-anchor="middle">机械闸门</text>
    <rect x="899" y="495" width="150" height="58" rx="29" fill="#ffffff" opacity="0.07" stroke="#3f4a63" stroke-width="1.5"/>
    <text x="974" y="531" text-anchor="middle">可判定预期</text>
  </g>
</svg>
